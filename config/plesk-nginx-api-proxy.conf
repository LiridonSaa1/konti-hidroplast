# Apply in Plesk: Domains > urban-rohr.com > Apache & nginx Settings >
# "Additional nginx directives" when the document root is dist/public.
#
# Routes API and upload traffic to the Node/Passenger backend.
location ^~ /api/ {
    proxy_pass https://127.0.0.1:7081;
    proxy_hide_header X-Powered-By;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /uploads/ {
    proxy_pass https://127.0.0.1:7081;
    proxy_hide_header X-Powered-By;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
