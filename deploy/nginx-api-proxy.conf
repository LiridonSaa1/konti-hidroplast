# Route API and upload requests on urban-rohr.com to the Node/Passenger app
# (deployed on the upbeat Plesk subdomain). Add via Plesk Hosting Settings
# "Additional nginx directives" or apply with scripts/configure-production-api.sh.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:7080;
    proxy_set_header Host upbeat-chandrasekhar.84-46-246-41.plesk.page;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:7080;
    proxy_set_header Host upbeat-chandrasekhar.84-46-246-41.plesk.page;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
